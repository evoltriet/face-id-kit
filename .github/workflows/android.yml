name: Android SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: gradle -p android -PcoreOnly :core:test --no-daemon
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - run: face-id-kit download-models --directory android/opencv/src/androidTest/assets/models
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle -p android :opencv:connectedDebugAndroidTest :storage:connectedDebugAndroidTest --no-daemon
