name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -c "import face_id_kit; from face_id_kit import InMemoryStore"
      - run: python -m pip install ".[demo,clustering,test]"
      - run: python -m pytest -q
      - run: python -m build
  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[opencv,test]"
      - run: face-id-kit download-models --directory .local-data/models
      - run: python scripts/smoke_models.py .local-data/models
