[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-id-kit"
version = "0.1.0"
description = "Local-first 1:N face identification with pluggable models and storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "evoltriet"}]
dependencies = ["numpy>=1.26,<3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Image Recognition"]

[project.optional-dependencies]
opencv = ["opencv-contrib-python-headless==4.12.0.88"]
storage = ["cryptography>=44,<47"]
clustering = ["scikit-learn>=1.5,<2"]
demo = ["face-id-kit[opencv,storage]", "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "Pillow>=11,<13"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1.2"]

[project.scripts]
face-id-kit = "face_id_kit.cli:main"

[project.urls]
Repository = "https://github.com/evoltriet/face-id-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_id_kit = ["py.typed", "demo/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
